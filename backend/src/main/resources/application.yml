server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: barber-date-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barber_date}
    username: ${DB_USERNAME:barberdate}
    password: ${DB_PASSWORD:barberdate123}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    time-zone: America/Sao_Paulo
  task:
    scheduling:
      time-zone: America/Sao_Paulo

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-with-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost}
  seed:
    admin-name: ${ADMIN_NAME:Barber Date Admin}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
